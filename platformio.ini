[env:esp32dev]
platform = espressif32@6.3.2
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    madhephaestus/ESP32Servo
    rfetick/MPU6050_light
    bblanchon/ArduinoJson@^6.21.0
    links2004/WebSockets@^2.4.0
    mikalhart/TinyGPSPlus@^1.1.0
    https://github.com/micro-ROS/micro_ros_arduino.git#humble
board_microros_transport = serial
board_microros_distro = humble
board_build.partitions = huge_app.csv
; Báo cho Linker biết đường dẫn tới file thư viện tĩnh của micro-ROS cho ESP32
build_flags =
    -L .pio/libdeps/esp32dev/micro_ros_arduino/src/esp32
    -l microros